{% extends 'students/base.html' %}
{% block title %}Delete Announcement — SMS{% endblock %}
{% block content %}

<div class="card" style="max-width:500px; margin:60px auto; text-align:center; padding:40px;">
    <p style="font-size:48px; margin-bottom:16px;"><i data-lucide="trash-2" style="width:48px; height:48px; color:var(--danger);"></i></p>
    <h2 style="font-size:22px; font-weight:800; margin-bottom:10px;">Delete Announcement?</h2>
    <p class="text-muted" style="font-size:14px; margin-bottom:28px;">
        Are you sure you want to delete <strong>"{{ announcement.title }}"</strong>? This cannot be undone.
    </p>
    <form method="POST" style="display:flex; justify-content:center; gap:12px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'announcement_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
