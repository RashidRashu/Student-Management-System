{% extends 'students/base.html' %}

{% block content %}
<h2>Grade Entry - {{ course.course_name }}</h2>

<form method="post">
    {% csrf_token %}
    <table border="1" cellpadding="10">
        <tr>
            <th>Student</th>
            <th>Marks</th>
        </tr>

        {% for enrollment in enrollments %}
        <tr>
            <td>{{ enrollment.student }}</td>
            <td>
                <input type="number" name="marks_{{ enrollment.id }}" min="0" max="100">
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <button type="submit">Save Grades</button>
</form>

{% endblock %}
