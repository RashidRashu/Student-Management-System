{% extends 'students/base.html' %}

{% block content %}
<h2 class="page-title">Courses</h2>
<a href="{% url 'add_course' %}" class="btn btn-secondary">📚 Add Course</a>
<div class="table-wrap">
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Course Name</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>{{ course.id }}</td>
                <td>
                    <a href="{% url 'course_detail' course.id %}">
                        {{ course }}
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" style="text-align:center; color:var(--muted); padding: 32px;">
                    No courses found
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
