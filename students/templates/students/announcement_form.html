{% extends 'students/base.html' %}
{% block title %}{{ title }} — SMS{% endblock %}
{% block content %}

<div class="flex-between mb-16">
    <div>
        <h1 class="page-title"><i data-lucide="megaphone" class="icon-heading"></i> {{ title }}</h1>
    </div>
    <a href="{% url 'announcement_list' %}" class="btn btn-secondary">← Back</a>
</div>

<div class="card" style="max-width:680px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_title">Title</label>
            {{ form.title }}
        </div>
        <div class="form-group">
            <label for="id_content">Content</label>
            {{ form.content }}
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:10px;">
            {{ form.is_active }}
            <label for="id_is_active"
                style="text-transform:none; letter-spacing:0; font-size:14px; color:var(--text);">Mark as Active
                (visible to students)</label>
        </div>
        <button type="submit" class="btn">💾 Save Announcement</button>
    </form>
</div>

{% endblock %}
